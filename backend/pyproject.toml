[project]
name = "ownhealth"
version = "0.1.0.dev0"
description = "The health data layer you own: one store, a web page and an MCP server."
license = "AGPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
authors = [{ name = "GeiserX" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg[binary]>=3.2",
  "mcp",
  "python-multipart",
  "pyyaml",
  "jsonschema",
  "pdfplumber",
  "pypdfium2",
  "pysam",
  "webauthn",
  "authlib",
  "prometheus-client",
  "httpx",
]

[project.scripts]
ownhealth = "ownhealth.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "hypothesis", "reportlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ownhealth"]
artifacts = ["src/ownhealth/static/**"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
