system: vitamins
order: 7
names: {en: Vitamins & minerals, es: Vitaminas y minerales}
markers: [vitamin_d_25oh, ferritin, vitamin_b12, magnesium]
rules:
  - id: recency.vitamins
    kind: recency
    match: [vitamin_d_25oh, ferritin, vitamin_b12, magnesium]
    window_days: 365
    cite: https://github.com/GeiserX/OwnHealth/blob/main/docs/design/architecture.md#11-current-state-the-deterministic-rule-pack
    basis: pack_default
  - id: rcv.ferritin
    kind: rcv
    match: [ferritin]
    cv_i: "14.2"
    cv_a: "3.0"
    cite: https://biologicalvariation.eu/
    verify: CV values to confirm against the EFLM database
