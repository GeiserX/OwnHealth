[package]
name = "ownhealth-ocr"
description = "Lane C (v0.2): local OCR of scans and photos (PaddleOCR PP-OCRv5 ONNX on ONNX Runtime), grounding, the benchmark."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The engine itself: oar-ocr with ONNX Runtime linked in. Only the `ocr` image builds it
# (`cargo build -p ownhealth --features ocr`); without it `engine::load` answers EngineMissing.
engine = ["dep:oar-ocr"]

[dependencies]
ownhealth-core.workspace = true
ownhealth-ingest-pdf.workspace = true
ownhealth-normalize.workspace = true
image.workspace = true
oar-ocr = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
ownhealth-core = { workspace = true, features = ["testing"] }
anyhow.workspace = true
