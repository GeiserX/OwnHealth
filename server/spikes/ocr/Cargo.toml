# The v0.2 OCR spike (SPIKES-v0.2.md a): PaddleOCR ONNX through ort (oar-ocr) against ocrs, on
# synthetic LabNorte pages degraded like scans and phone photos. Standalone: not a workspace member,
# so the app never builds these dependencies.
[package]
name = "ownhealth-spike-ocr"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27", default-features = false }
oar-ocr = "=0.10.2"
ocrs = "=0.14.0"
rten = "0.28"
pdfium-render = { version = "0.9.5", default-features = false, features = ["thread_safe", "pdfium_8125", "image_025"] }
rand = "0.9"
serde_json = "1"

[profile.release]
debug = false
