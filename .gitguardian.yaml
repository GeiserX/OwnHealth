# GitGuardian / ggshield. Only synthetic values from a throwaway 0.1.1 test install are ignored here:
# they prove that password, recovery-code and token hashes made by 0.1.1 still verify in Rust.
version: 2
secret:
  ignored-paths:
    - server/crates/ownhealth-api/tests/auth_python_rows.json
  # The made-up Orthanc password in the imaging config test (server/crates/ownhealth/tests/imaging_proxy.rs).
  ignored-matches:
    - name: synthetic Orthanc password in the imaging config test
      match: from-env
