# Conditions the cardiovascular calculators read (docs/calculators/score2.md, prevent.md). SCORE2 is
# for apparently healthy people: it refuses when established cardiovascular disease, diabetes, chronic
# kidney disease or familial hypercholesterolaemia is recorded. PREVENT is for adults without
# cardiovascular disease: it refuses on established cardiovascular disease or heart failure and reads
# diabetes as an input.
#
# A recorded condition (not refuted, not entered in error, resolved or not) is in a class when
#   - its text holds one of the `terms` as whole words, compared in lower case without accents, and
#     none of the `not_terms`; or
#   - its code was received as ICD-10 (any ICD-10 code system) and starts with one of `icd10`.
# Codes are matched only as received: no other code system is translated to ICD-10.
#
# id         ascvd | diabetes | ckd | fh | heart_failure
# terms      English and Spanish words, lower case, no accents
# not_terms  words that make a matching text mean something else
# icd10      code prefixes, with or without the dot
# cite       the definition
version: 0.1.0
rows:
  - id: ascvd
    terms: [
      myocardial infarction, heart attack, infarto, iam, angina, ischemic heart disease,
      ischaemic heart disease, cardiopatia isquemica, coronary artery disease, coronary heart disease,
      enfermedad coronaria, stroke, ictus, acv, accidente cerebrovascular, infarto cerebral,
      transient ischemic attack, transient ischaemic attack, ataque isquemico transitorio, ait,
      peripheral artery disease, peripheral arterial disease, enfermedad arterial periferica,
      arteriopatia periferica, coronary stent, stent coronario, coronary artery bypass, bypass coronario,
      coronary angioplasty, angioplastia coronaria,
    ]
    not_terms: [antecedentes familiares, family history, riesgo, risk]
    icd10: [I20, I21, I22, I23, I24, I25, I63, I64, I65, I66, I69.3, I70, I73.9, G45, Z95.1, Z95.5]
    cite: https://academic.oup.com/eurheartj/article/42/34/3227/6358713
  - id: diabetes
    terms: [diabetes, diabetes mellitus, dm1, dm2]
    not_terms: [gestational, gestacional, insipidus, insipida, antecedentes familiares, family history, riesgo, risk]
    icd10: [E08, E09, E10, E11, E13, E14]
    cite: https://academic.oup.com/eurheartj/article/42/34/3227/6358713
  - id: ckd
    terms: [chronic kidney disease, chronic renal failure, ckd, enfermedad renal cronica, insuficiencia renal cronica, erc]
    not_terms: [antecedentes familiares, family history, riesgo, risk]
    icd10: [N18]
    cite: https://academic.oup.com/eurheartj/article/42/34/3227/6358713
  - id: fh
    terms: [familial hypercholesterolemia, familial hypercholesterolaemia, hipercolesterolemia familiar]
    not_terms: [antecedentes familiares, family history]
    icd10: [E78.01]
    cite: https://academic.oup.com/eurheartj/article/42/34/3227/6358713
  - id: heart_failure
    terms: [heart failure, cardiac failure, insuficiencia cardiaca]
    not_terms: [antecedentes familiares, family history, riesgo, risk]
    icd10: [I50]
    cite: https://pubmed.ncbi.nlm.nih.gov/37947085/
