# SCORE2 and SCORE2-OP risk regions: the ESC member countries grouped by their WHO cardiovascular
# mortality, and the two numbers that recalibrate each model to a region (docs/calculators/score2.md).
#
# region     low | moderate | high | very_high
# countries  ISO 3166-1 alpha-2, as profile.country stores them; a country is in one region only
# score2     {sex: [scale1, scale2]} of SCORE2, from the SCORE2 paper (https://pubmed.ncbi.nlm.nih.gov/34120177/)
# score2_op  {sex: [scale1, scale2]} of SCORE2-OP, from the SCORE2-OP paper (https://pubmed.ncbi.nlm.nih.gov/34120185/)
# cite       the guideline that lists the countries of the region
#
# A profile with no country, or a country in no row, is refused; no region is guessed.
version: 0.1.0
rows:
  - id: score2.region.low
    region: low
    countries: [BE, CH, DK, ES, FR, GB, IL, LU, NL, NO]
    score2: {male: ["-0.5699", "0.7476"], female: ["-0.7380", "0.7019"]}
    score2_op: {male: ["-0.34", "1.19"], female: ["-0.52", "1.01"]}
    cite: https://academic.oup.com/eurheartj/article/42/34/3227/6358713
