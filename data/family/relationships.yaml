# Family relationships we record and draw, relative to the profile (the proband).
#
# code        HL7 v3 RoleCode (http://terminology.hl7.org/CodeSystem/v3-RoleCode), as FHIR
#             FamilyMemberHistory.relationship carries it.
# generation  0 is the proband's own generation; parents -1, children +1.
# side        paternal | maternal | own (the proband's own branch) | partner (not a blood relative).
# degree      1 first-degree, 2 second-degree, 3 third-degree; 0 is not a blood relative.
# sex         the sex the code implies, or null when the code does not say.
# slot        left-to-right order inside a generation in the pedigree drawing.
# union       the couple this relative is a member of in the drawing.
# child_of    the couple whose sibship line this relative hangs from (null: drawn without a line).
#
# The proband belongs to union "self" and is a child of "parents".
