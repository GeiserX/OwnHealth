name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1" # the Dockerfile's rust image; bump both together
  CARGO_TERM_COLOR: always

jobs:
  # The server (server/): format, lints, every crate's tests against a throwaway Postgres, and the
  # deploy checks (crates/ownhealth/tests/deploy.rs: the app role, the compose files).
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      OWNHEALTH_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          # PRs read main's caches and never write their own: a per-PR cache evicts main's (10 GB repo cap)
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # rust-cache hashes Cargo.lock and the member manifests, not this root one, so a [profile]
          # change would never reach main's cache; its hash in the key gives a fresh cache instead
          key: ${{ hashFiles('server/Cargo.toml') }}
      - name: PostgreSQL 17 client and restic 0.18.0, the versions the image ships (ownhealth-ops tests)
        working-directory: .
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/restic.bz2 https://github.com/restic/restic/releases/download/v0.18.0/restic_0.18.0_linux_amd64.bz2
          echo "98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 /tmp/restic.bz2 && sudo install -m 0755 /tmp/restic /usr/local/bin/restic
      - name: PDFium (pinned, sha256-checked)
        working-directory: .
        run: bash scripts/fetch-pdfium.sh linux-x64
      # uv runs the official Python MCP SDK client (pinned in its lock file) that ownhealth-mcp's
      # tests/python_client.rs drives against the server; the test fails in CI without it
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: server/crates/ownhealth-mcp/tests/py/mcp_client.py.lock
      - run: mkdir -p static # the UI build is embedded only in release builds; tests serve their own
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Information, never advice: 0 imperative phrases outside attributed quotes in everything we
      # write (crates/ownhealth/tests/wording_all.rs), as its own step so a wording failure is named.
      - name: Wording lint
        run: cargo test -p ownhealth --test wording_all --locked
      - run: cargo test --workspace --locked

  # The OCR engine (v0.2): the `ocr` feature links ONNX Runtime, so it gets its own lints, and the
  # real engine runs on the pinned models (scripts/fetch-ocr-models.sh, cached by their sums): the
  # exit-criteria test (ignored by default: it needs the models and an optimised build) reads the
  # scanned and photographed eval set and fails below row F1 0.90 or on any dropped or duplicated row,
  # so a model, dictionary or engine regression turns this job red. The server job above already runs
  # the OCR crate's model-free tests (routing, grounding) without it.
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      OWNHEALTH_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      OWNHEALTH_OCR_MODELS_DIR: ${{ github.workspace }}/server/vendor/ocr-models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ocr-${{ hashFiles('server/Cargo.toml') }}
      - name: PDFium (pinned, sha256-checked)
        working-directory: .
        run: bash scripts/fetch-pdfium.sh linux-x64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/vendor/ocr-models
          key: ocr-models-${{ hashFiles('scripts/fetch-ocr-models.sh') }}
      - name: OCR models (pinned, sha256-checked; a cached file is checked again)
        working-directory: .
        run: bash scripts/fetch-ocr-models.sh
      - run: mkdir -p static
      - run: cargo clippy -p ownhealth --features ocr --all-targets --locked -- -D warnings
      - run: cargo test -p ownhealth-ocr --features engine --release --locked -- --include-ignored

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: test -f ../server/static/index.html

  # The browser checks (ui/e2e/): Playwright on Chromium with the dark scheme, against the debug
  # server on a fresh demo database in the shared test Postgres that scripts/test-db.sh starts,
  # serving this UI build. A control test must fail on every run, or the job turns red.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ hashFiles('server/Cargo.toml') }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: PDFium (pinned, sha256-checked), so the demo's PDFs extract as they do in production
        run: bash scripts/fetch-pdfium.sh linux-x64
      - run: cargo build -p ownhealth --locked
        working-directory: server
      - name: Chromium for Playwright (the version @playwright/test pins)
        run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: ui
      - run: bash scripts/test-db.sh
      - run: pnpm run e2e
        working-directory: ui
      - name: Keep the traces and screenshots of a red run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: ui/e2e/test-results
          if-no-files-found: ignore

  # The black-box suite (contract-tests/): HTTP and MCP tests with goldens recorded from 0.1.1, on a
  # fresh demo database in the shared test Postgres that scripts/test-db.sh starts.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ hashFiles('server/Cargo.toml') }}
      - name: PDFium (pinned, sha256-checked)
        run: bash scripts/fetch-pdfium.sh linux-x64
      - run: mkdir -p server/static
      - run: bash contract-tests/run.sh rust

  # Which runners the docker job builds on. Main and manual runs always build both platforms. A PR
  # builds amd64 always, and arm64 too when it changes a build input: the Dockerfile and what it
  # copies to build (scripts, Cargo manifests, lock files, build.rs, .cargo config, ui/.npmrc,
  # vendored libraries, the OCR crate), the toolchain, or a workflow. A PR that changes only Rust or Svelte source builds the same way on
  # both platforms, and the arm64 pair still runs on main after the merge.
  docker-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.pick.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent, the base branch
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          both='["ubuntu-latest","ubuntu-24.04-arm"]'
          if [ "$EVENT" != pull_request ]; then
            echo "runners=$both" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames lists both paths of a move, so a file moved out of an input path still counts
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          echo "$(wc -l < "$RUNNER_TEMP/changed") files changed"
          inputs='^(Dockerfile|\.dockerignore|scripts/|ui/package\.json$|ui/pnpm-lock\.yaml$|ui/\.npmrc$|server/vendor/|server/crates/ownhealth-ocr/|\.github/workflows/)|(^|/)(Cargo\.(toml|lock)|build\.rs|rust-toolchain[^/]*|RUST_TOOLCHAIN)$|(^|/)\.cargo/'
          # grep exits 1 for no match and 2 for an error (a broken pattern): an error must not read as
          # "no input changed"
          rc=0
          grep -E "$inputs" "$RUNNER_TEMP/changed" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::grep failed with exit $rc: the inputs pattern is broken"
            exit 1
          elif [ "$rc" -eq 0 ]; then
            echo "runners=$both" >> "$GITHUB_OUTPUT"
          else
            echo "no build input changed: amd64 only"
            echo 'runners=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # Both platforms and both variants the release publishes, each on its own native runner: the arm64
  # PDFium build and its shared libraries are checked here, not only on a developer's machine. The
  # ocr variant (`--target ocr`) must also read the demo's scanned page.
  docker:
    needs: docker-runners
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.docker-runners.outputs.runners) }}
        variant: [default, ocr]
        include:
          - variant: default
            target: app
            tag: ci
            minutes: 45
          - variant: ocr
            target: ocr
            tag: ci-ocr
            minutes: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (no push)
        run: docker build --target "${{ matrix.target }}" -t "drumsergio/ownhealth:${{ matrix.tag }}" .
      - name: Smoke test (non-root, tools, libraries, models, readyz, UI, healthcheck, OCR, backup, verify-restore)
        run: bash scripts/smoke-image.sh "drumsergio/ownhealth:${{ matrix.tag }}" "${{ matrix.variant }}"
