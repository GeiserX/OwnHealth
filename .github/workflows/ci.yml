name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1" # the Dockerfile's rust image; bump both together
  CARGO_TERM_COLOR: always

jobs:
  # The Rust server (server/): format, lints, every crate's tests against a throwaway Postgres.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      OWNHEALTH_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: PostgreSQL 17 client and restic 0.18.0, the versions the image ships (ownhealth-ops tests)
        working-directory: .
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/restic.bz2 https://github.com/restic/restic/releases/download/v0.18.0/restic_0.18.0_linux_amd64.bz2
          echo "98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 /tmp/restic.bz2 && sudo install -m 0755 /tmp/restic /usr/local/bin/restic
      - name: PDFium (pinned, sha256-checked)
        working-directory: .
        run: bash scripts/fetch-pdfium.sh linux-x64
      - run: mkdir -p static # the UI build is embedded only in release builds; tests serve their own
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Python 0.1.1 backend: the reference the contract suite holds the Rust server to.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      OWNHEALTH_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          enable-cache: true
      - name: PostgreSQL 17 client and restic 0.18.0, the versions the image ships (tests/ops)
        working-directory: .
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/restic.bz2 https://github.com/restic/restic/releases/download/v0.18.0/restic_0.18.0_linux_amd64.bz2
          echo "98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 /tmp/restic.bz2 && sudo install -m 0755 /tmp/restic /usr/local/bin/restic
      - run: uv sync --frozen
      - run: uv run ruff check src tests ../deploy/tests
      - run: uv run ruff format --check src tests ../deploy/tests
      - run: uv run pytest -q
      - name: Deploy checks (app database role, compose files)
        run: uv run pytest -q ../deploy/tests

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm build
      - run: test -f ../server/static/index.html

  # The black-box suite (contract-tests/): the same HTTP and MCP tests against both backends, each on a
  # fresh demo database in the shared test Postgres that scripts/test-db.sh starts.
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.backend == 'python'
        with:
          version: "0.11.29"
          enable-cache: true
      - if: matrix.backend == 'python'
        working-directory: backend
        run: uv sync --frozen
      - name: PDFium (pinned, sha256-checked)
        run: bash scripts/fetch-pdfium.sh linux-x64
      - run: mkdir -p server/static
      - run: bash contract-tests/run.sh ${{ matrix.backend }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image (no push)
        run: docker build -t drumsergio/ownhealth:ci .
      - name: Image runs its CLI as the non-root user, with every tool the deploy recipes call
        run: |
          img=drumsergio/ownhealth:ci
          test "$(docker run --rm --entrypoint id "$img" -u)" = "10001"
          docker run --rm "$img" ownhealth --version | grep -qx "ownhealth $(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -1)"
          docker run --rm "$img" pg_dump --version | grep -q "PostgreSQL) 17\."
          docker run --rm "$img" psql --version | grep -q "PostgreSQL) 17\."
          docker run --rm "$img" restic version
          docker run --rm "$img" test -f /opt/ownhealth-db/app-role.sh
          # PDFium loads: every library it links against is in the image
          if docker run --rm --entrypoint ldd "$img" /usr/local/lib/libpdfium.so | grep "not found"; then exit 1; fi
      - name: The image serves the embedded UI and answers its own healthcheck
        run: |
          img=drumsergio/ownhealth:ci
          docker network create oh-ci
          docker run -d --name oh-ci-db --network oh-ci -e POSTGRES_PASSWORD=ci postgres:17.11
          for _ in $(seq 1 60); do docker exec oh-ci-db pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name oh-ci-app --network oh-ci -p 127.0.0.1:18080:8080 \
            -e OWNHEALTH_DATABASE_URL=postgresql://postgres:ci@oh-ci-db:5432/postgres \
            -e OWNHEALTH_SECRET_KEY="$(openssl rand -hex 48)" \
            -e OWNHEALTH_DEMO=1 "$img"
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/ | grep -qi "<!doctype html"
          docker exec oh-ci-app ownhealth healthcheck
          docker exec oh-ci-app ownhealth backup /data/backups/ci >/dev/null
          docker exec oh-ci-app ownhealth verify-restore /data/backups/ci | grep -q '"ok": true'
      - name: Logs of the image run
        if: failure()
        run: docker logs oh-ci-app || true
