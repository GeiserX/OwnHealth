# OwnHealth for a homelab: the app and Postgres behind Caddy with HTTPS, secrets kept in files,
# restic backups from a one-off admin container. Steps: deploy/README.md.
#
# Copy this file to compose.yaml in its own folder, next to Caddyfile, .env, restic.env, secrets/ and deploy/.
name: ownhealth

# Two database roles. `ownhealth` owns the tables: the one-shot `admin` service uses it to migrate, to
# restore, and to grant the app its rows (deploy/db/app-role.sql). The app connects as `ownhealth_app`,
# which owns nothing, so it cannot ALTER a table, disable a trigger, or rewrite the audit log.
services:
  admin:
    image: drumsergio/ownhealth:0.4.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - path: restic.env # RESTIC_REPOSITORY, and S3 keys for restic: the admin service only
        required: false # older installs keep them in .env
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD_FILE: /run/secrets/db_password
      OWNHEALTH_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      OWNHEALTH_SECRET_KEY_FILE: /run/secrets/secret_key
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    command: ["sh", "-c", "ownhealth migrate && sh /opt/ownhealth-db/app-role.sh"]
    healthcheck:
      disable: true
    secrets: [db_password, app_db_password, secret_key, restic_password]
    volumes:
      - ownhealth-data:/data # blobs, and /data/backups for the restic staging directory
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  app:
    image: drumsergio/ownhealth:0.4.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    env_file: .env # never restic.env: a compromised app must not reach the backups
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth_app@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD_FILE: /run/secrets/app_db_password
      OWNHEALTH_RUN_MIGRATIONS: "0" # the admin service migrated as the owner
      OWNHEALTH_SECRET_KEY_FILE: /run/secrets/secret_key
      OWNHEALTH_SECRETS_KEY_FILE: /run/secrets/secrets_key # seals inbox passwords and tokens (v0.2)
      OWNHEALTH_BASE_URL: https://${OWNHEALTH_DOMAIN:?set OWNHEALTH_DOMAIN in .env}
      OWNHEALTH_INBOX_DIR: /inbox # the watched folder: ./inbox/<profile>/ on the host
    secrets: [app_db_password, secret_key, secrets_key]
    volumes:
      - ownhealth-data:/data
      - ./inbox:/inbox
    # No published port: only Caddy reaches the app, on the compose network.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # `ocr` profile (v0.2): reads scans and photos with the local OCR engine. Turn it on with two lines
  # in .env: COMPOSE_PROFILES=ocr (starts this worker) and OWNHEALTH_OCR=1 (the app sends unread pages
  # to the `ocr` queue instead of leaving them pending). It serves no HTTP and only runs `ocr` jobs.
  ocr:
    profiles: [ocr]
    image: drumsergio/ownhealth:0.4.0-ocr
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    env_file: .env
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth_app@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD_FILE: /run/secrets/app_db_password
      OWNHEALTH_RUN_MIGRATIONS: "0"
      OWNHEALTH_SECRET_KEY_FILE: /run/secrets/secret_key
      OWNHEALTH_QUEUES: ocr
    command: ["ownhealth", "worker"]
    healthcheck:
      disable: true # a worker serves no /healthz
    secrets: [app_db_password, secret_key]
    volumes:
      - ownhealth-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ownhealth
      POSTGRES_DB: ownhealth
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownhealth -d ownhealth"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ownhealth-pg:/var/lib/postgresql/data

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    depends_on: [app]
    environment:
      OWNHEALTH_DOMAIN: ${OWNHEALTH_DOMAIN:?set OWNHEALTH_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # `wearables` profile (v1.0): the Open Wearables sidecar (MIT), which holds the Oura, Whoop, Polar and
  # Withings logins; the app pulls from its REST API. Turn it on with COMPOSE_PROFILES=wearables in .env
  # and three more files in secrets/: ow_db_password, ow_secret_key and ow_admin_password (long random
  # strings, e.g. `openssl rand -hex 32 > secrets/ow_secret_key`).
  # - Quiet: no usage pings, no Sentry, no OTLP export, no outgoing webhooks. It calls only the vendors.
  # - Fenced off: no published port (Caddy does not route to it), none of OwnHealth's secrets, and its
  #   own database and role on the same Postgres (deploy/db/ow-role.sql). That role cannot connect to
  #   the ownhealth database. OW's database is a cache, so `ownhealth backup` leaves it out.
  # - Redis is OW's Celery broker, on an internal network that only the sidecar joins. It keeps nothing
  #   on disk: a restart drops queued syncs, and beat queues them again.
  ow-db-init:
    profiles: [wearables]
    image: postgres:17.11
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        PGPASSWORD=$$(cat /run/secrets/db_password) && OPENWEARABLES_ROLE_PASSWORD=$$(cat /run/secrets/ow_db_password) &&
        export PGPASSWORD OPENWEARABLES_ROLE_PASSWORD &&
        exec psql postgresql://ownhealth@db:5432/ownhealth -X -q -v ON_ERROR_STOP=1
        -v ow_role=openwearables -v ow_db=openwearables -f /opt/ow-role.sql
    secrets: [db_password, ow_db_password]
    volumes:
      - ./deploy/db/ow-role.sql:/opt/ow-role.sql:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ow-app:
    profiles: [wearables]
    image: themomentum/open-wearables-backend:0.11.0@sha256:aaa0ccc7e6dcfbb3a36db6e0f63ec2782cf31a5bbd7cb466d11cd8d4657bc6dd
    restart: unless-stopped
    depends_on:
      ow-db-init:
        condition: service_completed_successfully
      ow-redis:
        condition: service_started
    environment: &ow-env
      ENVIRONMENT: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: openwearables
      DB_USER: openwearables
      REDIS_HOST: ow-redis
      UV_CACHE_DIR: /tmp/uv # the root filesystem is read-only
      TELEMETRY_ENABLED: "false"
      DO_NOT_TRACK: "1"
      SENTRY_ENABLED: "false"
      OTEL_ENABLED: "false"
      OUTGOING_WEBHOOKS_ENABLED: "false"
    # OW reads its secrets from the environment only, so the shell hands the files over, then runs
    # migrations, seeds, and the API on :8000 (compose network only)
    command:
      - sh
      - -c
      - >-
        DB_PASSWORD=$$(cat /run/secrets/ow_db_password) && SECRET_KEY=$$(cat /run/secrets/ow_secret_key) &&
        ADMIN_PASSWORD=$$(cat /run/secrets/ow_admin_password) &&
        : "$${DB_PASSWORD:?empty}" "$${SECRET_KEY:?empty}" "$${ADMIN_PASSWORD:?empty}" &&
        export DB_PASSWORD SECRET_KEY ADMIN_PASSWORD && exec scripts/start/app.sh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    secrets: [ow_db_password, ow_secret_key, ow_admin_password]
    networks: [default, wearables]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ow-worker:
    profiles: [wearables]
    image: themomentum/open-wearables-backend:0.11.0@sha256:aaa0ccc7e6dcfbb3a36db6e0f63ec2782cf31a5bbd7cb466d11cd8d4657bc6dd
    restart: unless-stopped
    depends_on:
      ow-app:
        condition: service_healthy # OW's migrations ran
    environment: *ow-env
    command:
      - sh
      - -c
      - >-
        DB_PASSWORD=$$(cat /run/secrets/ow_db_password) && SECRET_KEY=$$(cat /run/secrets/ow_secret_key) &&
        : "$${DB_PASSWORD:?empty}" "$${SECRET_KEY:?empty}" &&
        export DB_PASSWORD SECRET_KEY && exec scripts/start/worker.sh
    secrets: [ow_db_password, ow_secret_key]
    networks: [default, wearables]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ow-beat:
    profiles: [wearables]
    image: themomentum/open-wearables-backend:0.11.0@sha256:aaa0ccc7e6dcfbb3a36db6e0f63ec2782cf31a5bbd7cb466d11cd8d4657bc6dd
    restart: unless-stopped
    depends_on:
      ow-app:
        condition: service_healthy
    environment: *ow-env
    command:
      - sh
      - -c
      - >-
        DB_PASSWORD=$$(cat /run/secrets/ow_db_password) && SECRET_KEY=$$(cat /run/secrets/ow_secret_key) &&
        : "$${DB_PASSWORD:?empty}" "$${SECRET_KEY:?empty}" &&
        export DB_PASSWORD SECRET_KEY && exec scripts/start/beat.sh
    secrets: [ow_db_password, ow_secret_key]
    networks: [default, wearables]
    # not read-only: celery beat keeps its schedule file in its working directory
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ow-redis:
    profiles: [wearables]
    image: redis:8.10.3
    restart: unless-stopped
    user: redis # the image's own user, so the entrypoint needs no capability to switch to it
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [wearables]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  wearables:
    internal: true # no route out: Redis reaches nothing, and only the sidecar reaches Redis

secrets:
  db_password:
    file: ./secrets/db_password # the owner role's password (migrations, backups, restores)
  app_db_password:
    file: ./secrets/app_db_password # the app role's password
  secret_key:
    file: ./secrets/secret_key
  secrets_key:
    file: ./secrets/secrets_key # inbox credentials at rest; keep a copy with the restic password
  restic_password:
    file: ./secrets/restic_password # keep a copy in your password manager: without it the backup is useless
  ow_db_password:
    file: ./secrets/ow_db_password # wearables profile: Open Wearables' database role
  ow_secret_key:
    file: ./secrets/ow_secret_key # wearables profile: signs OW's sessions and API keys
  ow_admin_password:
    file: ./secrets/ow_admin_password # wearables profile: OW's admin account

volumes:
  ownhealth-data:
  ownhealth-pg:
  caddy-data:
  caddy-config:
