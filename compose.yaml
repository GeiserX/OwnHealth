# OwnHealth: the app and its Postgres. `cp .env.example .env`, set the secrets, write the key file
# secrets/secrets_key, make the folder keyring/ownhealth/ (docs/quickstart.md), `docker compose up -d`.
name: ownhealth

# Two database roles. `ownhealth` owns the tables: the one-shot `admin` service uses it to migrate and
# then grants the app its rows (deploy/db/app-role.sql). The app connects as `ownhealth_app`, which owns
# nothing, so it cannot ALTER a table, disable a trigger, or UPDATE, DELETE or TRUNCATE the audit log.
services:
  admin:
    image: drumsergio/ownhealth:0.4.0
    build:
      context: .
      target: app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth@db:5432/ownhealth
      OWNHEALTH_DATA_DIR: /data
      OWNHEALTH_SECRETS_KEY_FILE: /run/secrets/secrets_key # backups and restores open the sealed files
      OWNHEALTH_KEYRING_DIR: /keyring # backups write the profile keys here, restores read them
    command: ["sh", "-c", "ownhealth migrate && sh /opt/ownhealth-db/app-role.sh"]
    healthcheck:
      disable: true
    secrets: [secrets_key]
    volumes:
      - ownhealth-data:/data
      # The profile keys (keyring.json), on their own mount: never in the data volume, the backups or
      # restic. Host backup tools must skip this folder (deploy/README.md, "The keyring").
      - ./keyring/${COMPOSE_PROJECT_NAME}:/keyring

  app:
    image: drumsergio/ownhealth:0.4.0
    build:
      context: .
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    env_file: .env
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth_app@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD: ${OWNHEALTH_APP_DB_PASSWORD:?set OWNHEALTH_APP_DB_PASSWORD in .env}
      OWNHEALTH_RUN_MIGRATIONS: "0" # the admin service migrated as the owner
      OWNHEALTH_DATA_DIR: /data
      OWNHEALTH_SECRETS_KEY_FILE: /run/secrets/secrets_key
      # Throwaway demo only (docs/quickstart.md step 5); empty means off.
      OWNHEALTH_DEMO: ${OWNHEALTH_DEMO:-}
      OWNHEALTH_DEV_AUTH: ${OWNHEALTH_DEV_AUTH:-}
      # The watched folder (v0.2): a scanner or a synced phone folder drops files in ./inbox/<profile>/.
      OWNHEALTH_INBOX_DIR: /inbox
      OWNHEALTH_KEYRING_DIR: /keyring # a profile delete drops the profile's key from keyring.json at once
      # The `imaging` profile (below): where Orthanc is, and the app's password there. Empty: imaging off.
      OWNHEALTH_ORTHANC_URL: ${OWNHEALTH_ORTHANC_URL:-}
      OWNHEALTH_ORTHANC_PASSWORD: ${OWNHEALTH_ORTHANC_PASSWORD:-}
    networks: [default, ow-api]
    ports:
      - "127.0.0.1:${OWNHEALTH_HTTP_PORT:-8080}:8080"
    secrets: [secrets_key]
    volumes:
      - ownhealth-data:/data
      - ./inbox:/inbox
      - ./keyring/${COMPOSE_PROJECT_NAME}:/keyring # the same folder as the admin service's

  # `ocr` profile (v0.2): reads scans and photos with the local OCR engine. Turn it on with two lines
  # in .env: COMPOSE_PROFILES=ocr (starts this worker) and OWNHEALTH_OCR=1 (the app sends unread pages
  # to the `ocr` queue instead of leaving them pending). Same code as the app, from the image variant
  # that carries the engine and the models; it serves no HTTP, it only runs `ocr` jobs.
  ocr:
    profiles: [ocr]
    image: drumsergio/ownhealth:0.4.0-ocr
    build:
      context: .
      target: ocr
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_completed_successfully
    env_file: .env
    environment:
      OWNHEALTH_DATABASE_URL: postgresql://ownhealth_app@db:5432/ownhealth
      OWNHEALTH_DB_PASSWORD: ${OWNHEALTH_APP_DB_PASSWORD:?set OWNHEALTH_APP_DB_PASSWORD in .env}
      OWNHEALTH_RUN_MIGRATIONS: "0"
      OWNHEALTH_DATA_DIR: /data
      OWNHEALTH_SECRETS_KEY_FILE: /run/secrets/secrets_key
      OWNHEALTH_QUEUES: ocr
    command: ["ownhealth", "worker"]
    healthcheck:
      disable: true # a worker serves no /healthz
    secrets: [secrets_key]
    volumes:
      - ownhealth-data:/data

  # `imaging` profile (v1.0): Orthanc keeps the DICOM studies and serves the OHIF viewer, to the app
  # only. It publishes no port: the app checks every viewer request first (docs/design/architecture.md
  # section 4). Turn it on with three lines in .env: COMPOSE_PROFILES=imaging (with OCR too:
  # COMPOSE_PROFILES=ocr,imaging), OWNHEALTH_ORTHANC_URL=http://orthanc:8042 and
  # OWNHEALTH_ORTHANC_PASSWORD=<the output of `openssl rand -hex 32`>.
  # Orthanc must be this one, OwnHealth's own: the app deletes every study in it that its record does
  # not name (the imaging.sweep job, at every start and every hour), so never point
  # OWNHEALTH_ORTHANC_URL at an Orthanc that holds other studies. Its storage is not backed up: after a
  # restore the app sends every recorded study back from the stored uploads (imaging.rebuild).
  orthanc:
    profiles: [imaging]
    image: orthancteam/orthanc:26.11.1
    restart: unless-stopped
    # Orthanc's one account is the app's. Its password comes from the secret, never from this file.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export ORTHANC__REGISTERED_USERS="{\"ownhealth\": \"$$(cat /run/secrets/orthanc_password)\"}" &&
        exec /docker-entrypoint.sh /tmp/orthanc.json
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__DICOM_SERVER_ENABLED: "false" # studies arrive from the app over HTTP, never over DICOM
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ENABLE_METADATA_CACHE: "true"
      OHIF_PLUGIN_ENABLED: "true"
      # The plugin's default data source, dicom-json, reads Orthanc-id routes that the app refuses.
      ORTHANC__OHIF__DATA_SOURCE: dicom-web
    secrets: [orthanc_password]
    volumes:
      - ownhealth-orthanc:/var/lib/orthanc/db

  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ownhealth
      POSTGRES_DB: ownhealth
      POSTGRES_PASSWORD: ${OWNHEALTH_DB_PASSWORD:?set OWNHEALTH_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownhealth -d ownhealth"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ownhealth-pg:/var/lib/postgresql/data
    networks: [default, ow-db] # ow-db: the wearables sidecar's only way to OwnHealth's side

  # `wearables` profile (v1.0): the Open Wearables sidecar (MIT), which holds the Oura, Whoop, Polar and
  # Withings logins; the app pulls from its REST API. Turn it on in two steps:
  # - add wearables to COMPOSE_PROFILES in .env: COMPOSE_PROFILES=wearables, or ocr,wearables with OCR on;
  # - put three lines in openwearables.env, next to .env and never in it, so OwnHealth's own containers
  #   never hold them: OPENWEARABLES_DB_PASSWORD, OPENWEARABLES_SECRET_KEY and OPENWEARABLES_ADMIN_PASSWORD
  #   (long random strings, e.g. `openssl rand -hex 32`).
  # - Quiet: no usage pings, no Sentry, no OTLP export, no outgoing webhooks. It calls only the vendors.
  # - Fenced off: no published port, none of OwnHealth's secrets (never .env), and its own database and
  #   role on the same Postgres (deploy/db/ow-role.sql). That role cannot connect to the ownhealth
  #   database. OW's database is a cache, so `ownhealth backup` leaves it out.
  # - The app calls ow-app:8000 on ow-api. The sidecar reaches Postgres on ow-db and vendors on ow-egress.
  # - Redis is OW's Celery broker, on an internal network that only the sidecar joins. It keeps nothing
  #   on disk: a restart drops queued syncs, and beat queues them again.
  ow-db-init:
    profiles: [wearables]
    image: postgres:17.11
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      # the sidecar starts only once OwnHealth is up: a broken OW secret stops OW, never the app
      app:
        condition: service_healthy
    env_file: &ow-env-file
      - path: openwearables.env # OW's secrets, for the four sidecar services only
        required: false # without it ow-db-init stops and names the missing variable
    environment:
      PGPASSWORD: ${OWNHEALTH_DB_PASSWORD:-}
    command: ["psql", "postgresql://ownhealth@db:5432/ownhealth", "-X", "-q", "-v", "ON_ERROR_STOP=1",
              "-v", "ow_role=openwearables", "-v", "ow_db=openwearables", "-f", "/opt/ow-role.sql"]
    volumes:
      - ./deploy/db/ow-role.sql:/opt/ow-role.sql:ro
    networks: [ow-db]

  ow-app:
    profiles: [wearables]
    image: themomentum/open-wearables-backend:0.11.0@sha256:aaa0ccc7e6dcfbb3a36db6e0f63ec2782cf31a5bbd7cb466d11cd8d4657bc6dd
    restart: unless-stopped
    depends_on:
      ow-db-init:
        condition: service_completed_successfully
      ow-redis:
        condition: service_started
    env_file: *ow-env-file
    environment: &ow-env
      ENVIRONMENT: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: openwearables
      DB_USER: openwearables
      REDIS_HOST: ow-redis
      TELEMETRY_ENABLED: "false"
      DO_NOT_TRACK: "1"
      SENTRY_ENABLED: "false"
      OTEL_ENABLED: "false"
      OUTGOING_WEBHOOKS_ENABLED: "false"
    # OW reads DB_PASSWORD, SECRET_KEY and ADMIN_PASSWORD, so the shell takes them from openwearables.env,
    # then runs migrations, seeds, and the API on :8000 (not published)
    command:
      - sh
      - -c
      - >-
        DB_PASSWORD="$${OPENWEARABLES_DB_PASSWORD:?set it in openwearables.env}" &&
        SECRET_KEY="$${OPENWEARABLES_SECRET_KEY:?set it in openwearables.env}" &&
        ADMIN_PASSWORD="$${OPENWEARABLES_ADMIN_PASSWORD:?set it in openwearables.env}" &&
        export DB_PASSWORD SECRET_KEY ADMIN_PASSWORD && exec scripts/start/app.sh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    networks: [ow-db, wearables, ow-egress, ow-api]

  ow-worker:
    profiles: [wearables]
    image: themomentum/open-wearables-backend:0.11.0@sha256:aaa0ccc7e6dcfbb3a36db6e0f63ec2782cf31a5bbd7cb466d11cd8d4657bc6dd
    restart: unless-stopped
    depends_on:
      ow-app:
        condition: service_healthy # OW's migrations ran
    env_file: *ow-env-file
    environment: *ow-env
    command:
      - sh
      - -c
      - >-
        DB_PASSWORD="$${OPENWEARABLES_DB_PASSWORD:?set it in openwearables.env}" &&
        SECRET_KEY="$${OPENWEARABLES_SECRET_KEY:?set it in openwearables.env}" &&
        export DB_PASSWORD SECRET_KEY && exec scripts/start/worker.sh
    networks: [ow-db, wearables, ow-egress]

  ow-beat:
    profiles: [wearables]
    image: themomentum/open-wearables-backend:0.11.0@sha256:aaa0ccc7e6dcfbb3a36db6e0f63ec2782cf31a5bbd7cb466d11cd8d4657bc6dd
    restart: unless-stopped
    depends_on:
      ow-app:
        condition: service_healthy
    env_file: *ow-env-file
    environment: *ow-env
    command:
      - sh
      - -c
      - >-
        DB_PASSWORD="$${OPENWEARABLES_DB_PASSWORD:?set it in openwearables.env}" &&
        SECRET_KEY="$${OPENWEARABLES_SECRET_KEY:?set it in openwearables.env}" &&
        export DB_PASSWORD SECRET_KEY && exec scripts/start/beat.sh
    networks: [ow-db, wearables]

  ow-redis:
    profiles: [wearables]
    image: redis:8.10.3
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [wearables]

networks:
  ow-api:
    internal: true # the OwnHealth poller and the Open Wearables API
  wearables:
    internal: true # no route out: Redis reaches nothing, and only the sidecar reaches Redis
  ow-db:
    internal: true # db and the sidecar only: OW reaches Postgres, and no other OwnHealth container
  ow-egress: # the sidecar's way out to the vendors' APIs; no OwnHealth container joins it

secrets:
  # The key every profile's files and the inboxes' secrets are sealed under. Compose refuses to start
  # without the file. Keep a copy with your backups: without it they cannot be read.
  secrets_key:
    file: ./secrets/secrets_key
  orthanc_password:
    environment: OWNHEALTH_ORTHANC_PASSWORD # read only when the imaging profile is on

volumes:
  ownhealth-data:
  ownhealth-pg:
  ownhealth-orthanc:
